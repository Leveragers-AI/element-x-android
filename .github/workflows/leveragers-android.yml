# Leveragers: the only workflow of this fork. Builds the signed APKs of "Agents by Leveragers" and its Google Play
# bundle (AAB, signed with our upload key; Google re-signs it with the app signing key it keeps) and, on request,
# signs in to chat.leveragers.com on an emulator with a throwaway test account. Element's own workflows are removed
# from this branch (see LEVERAGERS.md).
name: Agents by Leveragers (APK and AAB)

on:
  workflow_dispatch:
    inputs:
      emulator_test:
        description: Sign in to chat.leveragers.com on an emulator with the test account
        type: boolean
        default: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon --no-configuration-cache
  # Our build number, part of the version code (plugins/src/main/kotlin/Versions.kt): every upload to Google Play
  # must have a higher version code than the one before. A re-run keeps the same number, so Play would refuse its AAB.
  LEVERAGERS_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'
          gradle-cache-read-only: 'false'
      - name: Unit tests of the modules Leveragers changes
        run: >-
          ./gradlew
          :features:enterprise:impl-foss:testDebugUnitTest
          :features:login:impl:testDebugUnitTest
          :features:startchat:impl:testDebugUnitTest
          :libraries:fullscreenintent:impl:testDebugUnitTest
          $CI_GRADLE_ARG_PROPERTIES
      # The screens whose entries depend on LeveragersConfig.ALLOWS_BLOCKING_AND_REPORTING (blocking and reporting,
      # needed for Google Play): their tests check the entries match the switch.
      - name: Unit tests of the blocking and reporting entries
        run: |
          set -e
          ./gradlew :features:home:impl:testDebugUnitTest --tests '*RoomListDeclineInviteMenuTest' $CI_GRADLE_ARG_PROPERTIES
          ./gradlew :features:joinroom:impl:testDebugUnitTest --tests '*JoinRoomViewTest' $CI_GRADLE_ARG_PROPERTIES
          ./gradlew :features:messages:impl:testDebugUnitTest --tests '*ActionListPresenterTest' $CI_GRADLE_ARG_PROPERTIES
          ./gradlew :features:preferences:impl:testDebugUnitTest --tests '*ModerationAndSafetyViewTest' $CI_GRADLE_ARG_PROPERTIES
          ./gradlew :features:roomdetails:impl:testDebugUnitTest --tests '*RoomDetailsViewTest' $CI_GRADLE_ARG_PROPERTIES
          ./gradlew :features:userprofile:shared:testDebugUnitTest --tests '*UserProfileViewTest' $CI_GRADLE_ARG_PROPERTIES
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
      - name: Build release APKs
        env:
          LEVERAGERS_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.p12
          LEVERAGERS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEVERAGERS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES
      # A separate Gradle run: app/build.gradle.kts turns the per-ABI APK splits off when a task name contains "bundle".
      - name: Build the Google Play bundle (AAB)
        env:
          LEVERAGERS_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.p12
          LEVERAGERS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEVERAGERS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:bundleGplayRelease $CI_GRADLE_ARG_PROPERTIES
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.p12"
      - name: Checksums and signer
        run: |
          cd app/build/outputs/apk/gplay/release
          ls -la
          sha256sum *.apk | tee SHA256SUMS
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs app-gplay-universal-release.apk | tee apksigner.txt
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging app-gplay-universal-release.apk | head -3 | tee -a apksigner.txt
          # What Google Play will see: the permissions, and the full merged manifest (foreground service types).
          "$AAPT2" dump permissions app-gplay-universal-release.apk | tee permissions.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml app-gplay-universal-release.apk > manifest.txt
          echo "Foreground service types declared:"; grep -c foregroundServiceType manifest.txt || true
      - name: Checksum and signer of the AAB
        run: |
          cd app/build/outputs/bundle/gplayRelease
          ls -la
          sha256sum *.aab | tee SHA256SUMS
          keytool -printcert -jarfile *.aab | tee aab-signer.txt
      - name: Name the phone APK
        run: |
          VERSION="$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging app/build/outputs/apk/gplay/release/app-gplay-arm64-v8a-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          cp app/build/outputs/apk/gplay/release/app-gplay-arm64-v8a-release.apk "Agents-${VERSION}-${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -la Agents-*.apk
      # One plain file (not a zip), the APK that fits almost every recent phone (64-bit ARM).
      - name: Upload the phone APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Agents-*-arm64.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-apks
          path: |
            app/build/outputs/apk/gplay/release/*.apk
            app/build/outputs/apk/gplay/release/SHA256SUMS
            app/build/outputs/apk/gplay/release/apksigner.txt
            app/build/outputs/apk/gplay/release/permissions.txt
            app/build/outputs/apk/gplay/release/manifest.txt
          retention-days: 30
          if-no-files-found: error
      # The file to upload to Google Play, with R8's mapping (for readable crash reports in Play Console).
      - name: Upload the AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-aab
          path: |
            app/build/outputs/bundle/gplayRelease/*.aab
            app/build/outputs/bundle/gplayRelease/SHA256SUMS
            app/build/outputs/bundle/gplayRelease/aab-signer.txt
            app/build/outputs/mapping/gplayRelease/mapping.txt
          retention-days: 30
          if-no-files-found: error

  emulator:
    name: Sign in on an emulator
    needs: [ build ]
    if: ${{ inputs.emulator_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents-apks
          path: apks
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Sign in with the test account
        id: signin
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true
        env:
          TEST_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_7_pro
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 3G
          script: .maestro-leveragers/run.sh apks/app-gplay-x86_64-release.apk .maestro-leveragers/signin.yaml com.leveragers.agents
      # Screenshots only: Maestro's own log records the typed text (the test password), and artifacts of a public
      # repository can be downloaded by anyone signed in to GitHub. Its tail goes to the job log, where secrets are masked.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-signin
          path: |
            shots/**
            ~/.maestro/tests/**/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Fail if the sign-in failed
        if: steps.signin.outcome != 'success'
        run: exit 1
