# Leveragers: sign-in check on an emulator without rebuilding, either with the APK of an earlier run of
# "Agents by Leveragers (APK)", or with Element's official Element X (control). Screenshots only are published
# (Maestro's own log records the typed text, and artifacts of a public repository are downloadable by anyone
# signed in to GitHub).
name: Agents by Leveragers (emulator sign-in)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to sign in with
        type: choice
        options: [ agents, element-official ]
        default: agents
      apk_run_id:
        description: Run id of "Agents by Leveragers (APK)" whose APK to test (app = agents)
        type: string
        required: false
      email:
        description: Sign-in e-mail of a throwaway test account (default = the TEST_ACCOUNT_EMAIL secret); its password is TEST_ACCOUNT_PASSWORD
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    name: Sign in on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the Agents APK
        if: ${{ inputs.app == 'agents' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents-apks
          path: apks
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Get Element's official APK
        if: ${{ inputs.app == 'element-official' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v26.11.0 --repo element-hq/element-x-android --pattern 'app-fdroid-x86_64-release-signed.apk' --dir apks
      - name: Choose the flow
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ "$APP" = "agents" ]; then
            echo "APK=apks/app-gplay-x86_64-release.apk" >> "$GITHUB_ENV"
            echo "FLOW=.maestro-leveragers/signin.yaml" >> "$GITHUB_ENV"
            echo "PKG=com.leveragers.agents" >> "$GITHUB_ENV"
          else
            echo "APK=apks/app-fdroid-x86_64-release-signed.apk" >> "$GITHUB_ENV"
            echo "FLOW=.maestro-leveragers/official-signin.yaml" >> "$GITHUB_ENV"
            echo "PKG=io.element.android.x" >> "$GITHUB_ENV"
          fi
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Sign in with the test account
        id: signin
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true
        env:
          TEST_EMAIL: ${{ inputs.email || secrets.TEST_ACCOUNT_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_7_pro
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 3G
          script: .maestro-leveragers/run.sh "$APK" "$FLOW" "$PKG"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-signin-${{ inputs.app }}
          path: |
            shots/**
            ~/.maestro/tests/**/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Fail if the sign-in flow failed
        if: steps.signin.outcome != 'success'
        run: exit 1
