# Leveragers: sign in to chat.leveragers.com with the throwaway test account (Agents app). What the app shows
# afterwards is captured by run.sh (screenshots and visible texts), before and after a relaunch.
appId: com.leveragers.agents
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in to chat.leveragers.com"
    timeout: 60000
- takeScreenshot: shots/01-start
- tapOn: "Sign in to chat.leveragers.com"
- runFlow:
    file: web-signin.yaml
    env:
      APP_ID: com.leveragers.agents
